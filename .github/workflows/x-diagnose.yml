# One-off X API diagnosis (temporary; delete after use). Manual only.
# "post" sends the pending X post of diary entry "Two Publishers, One Shared
# Failure" (run 96 failed on it with 403) and prints the full response.
name: x-diagnose

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Also POST the pending card-2 tweet"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose
        env:
          XCOM_BYKO_API_KEY: ${{ secrets.XCOM_BYKO_API_KEY }}
          XCOM_BYKO_API_SECRET: ${{ secrets.XCOM_BYKO_API_SECRET }}
          XCOM_BYKO_ACCESS_TOKEN: ${{ secrets.XCOM_BYKO_ACCESS_TOKEN }}
          XCOM_BYKO_ACCESS_SECRET: ${{ secrets.XCOM_BYKO_ACCESS_SECRET }}
          POST_CARD2: ${{ inputs.post }}
        run: node scripts/x-diagnose.mjs

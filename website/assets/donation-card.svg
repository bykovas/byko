<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="1240" viewBox="0 0 1748 1240">
<!-- BYKO donation card, A6 landscape (148 × 105 mm) at 300 dpi.
     Filled at request time by functions/card/[serial].js:
     {{SERIAL}} {{NOMINAL}} {{DATE}} {{DATE_SHORT}} {{TXHASH}} {{BEARER}} {{INSCRIPTION}}
     This is the only BYKO object that cannot be revised after printing,
     so it follows the system exactly: paper, rules, no boxes, mono for
     data only. -->

<rect width="1748" height="1240" fill="#FAF9F5"/>

<!-- the stub: blue, the mark, the serial set vertically -->
<rect x="0" y="0" width="250" height="1240" fill="#7CCBFF"/>
<g transform="translate(80,90) scale(0.94)" fill="none" stroke="#08405F" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter"><path d="M24 14 V82"/><path d="M40 20 L70 48 L40 76"/></g>
<text transform="translate(160,320) rotate(90)" font-family="IBM Plex Mono" font-weight="600" font-size="30" letter-spacing="5.4" fill="#08405F">{{SERIAL}}</text>
<text transform="translate(105,320) rotate(90)" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="4.2" fill="#08405F">DONATION CARD</text>

<!-- perforation -->
<line x1="250" y1="0" x2="250" y2="1240" stroke="rgba(13,17,22,.28)" stroke-width="2" stroke-dasharray="12 10"/>

<!-- head -->
<text x="330" y="140" font-family="Archivo" font-weight="600" font-size="19" letter-spacing="3" fill="#0A5C8F">BYKO · A RECORD, NOT A CLAIM</text>
<text x="330" y="212" font-family="Archivo" font-weight="700" font-size="52" letter-spacing="-1.6" fill="#0D1116">Donation card</text>
<line x1="330" y1="252" x2="1660" y2="252" stroke="#0D1116" stroke-width="2.5"/>

<!-- fields -->
<text x="330" y="316" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="3" fill="#5A6068">NOMINAL</text>
<text x="700" y="322" font-family="IBM Plex Mono" font-weight="600" font-size="40" fill="#0D1116">{{NOMINAL}}</text>
<text x="700" y="322" font-family="Archivo" font-weight="600" font-size="20" fill="#5A6068" dx="270">BYKO</text>
<line x1="330" y1="352" x2="1660" y2="352" stroke="#DCD8CD"/>

<text x="330" y="412" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="3" fill="#5A6068">DATE</text>
<text x="700" y="414" font-family="IBM Plex Mono" font-size="26" fill="#0D1116">{{DATE}}</text>
<line x1="330" y1="446" x2="1660" y2="446" stroke="#DCD8CD"/>

<text x="330" y="506" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="3" fill="#5A6068">TRANSACTION</text>
<text x="700" y="500" font-family="IBM Plex Mono" font-size="21" fill="#0D1116">{{TXHASH}}</text>
<line x1="330" y1="540" x2="1660" y2="540" stroke="#DCD8CD"/>

<text x="330" y="600" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="3" fill="#5A6068">BEARER</text>
<text x="700" y="600" font-family="IBM Plex Mono" font-size="24" fill="#0D1116">{{BEARER}}</text>
<line x1="330" y1="634" x2="1660" y2="634" stroke="#DCD8CD"/>

<!-- the inscription, on the warm rule -->
<rect x="330" y="700" width="4" height="240" fill="#FFB088"/>
<text x="368" y="760" font-family="Archivo" font-style="italic" font-weight="400" font-size="34" fill="#0D1116">{{INSCRIPTION}}</text>

<!-- foot -->
<line x1="330" y1="1030" x2="1660" y2="1030" stroke="#0D1116" stroke-width="2.5"/>
<text x="330" y="1082" font-family="Archivo" font-weight="600" font-size="17" letter-spacing="3" fill="#5A6068">PERMANENT COPY</text>
<text x="330" y="1122" font-family="IBM Plex Mono" font-size="24" fill="#0A5C8F">byko.bykovas.lt/card/{{SERIAL}}</text>
<text x="1660" y="1082" font-family="Archivo" font-weight="400" font-size="19" fill="#333A43" text-anchor="end">This card confers no rights, no yield and no claim on anything.</text>
<text x="1660" y="1122" font-family="Archivo" font-weight="400" font-size="19" fill="#333A43" text-anchor="end">It records that a donation happened. That is all it does.</text>
<text x="1660" y="1170" font-family="IBM Plex Mono" font-size="19" fill="#5A6068" text-anchor="end">1 BYKO = 1 BYKO</text>
</svg>

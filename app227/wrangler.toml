# byko-app227 — Farcaster mini-app on byko-app227.bykovas.lt.
# A self-contained Worker with static assets: deployed from this directory
# with `wrangler deploy`, fully separate from the Cloudflare Pages project
# that serves byko.bykovas.lt (repo /website + /functions).
#
# No secrets in this file, ever. Production secrets go in with
# `wrangler secret put NAME` (run from app227/); local dev values live in
# .dev.vars — see .dev.vars.example for the list.
#
# The D1 database, KV namespace and queue below exist in the account
# (created 18 Aug 2026 per README.md). The D1 schema is NOT applied yet —
# reconcile db/schema.sql with the architecture document first.

name = "byko-app227"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
# @sentry/cloudflare needs AsyncLocalStorage
compatibility_flags = ["nodejs_compat"]

# Custom domain: the bykovas.lt zone is already on Cloudflare, so the DNS
# record is created automatically the first time this route deploys.
routes = [
  { pattern = "byko-app227.bykovas.lt", custom_domain = true }
]
# The custom domain is the app's identity (signed accountAssociation) and the
# Quick Auth audience. No alias origins: workers.dev and per-version preview
# URLs stay off so tokens only ever bind to the one real domain.
workers_dev = false
preview_urls = false

[vars]
# plain configuration, not secrets
RPC_URL = "https://mainnet.base.org"
CLAIMS_URL = "https://byko.bykovas.lt/data/claims.json"
# a DSN is an ingest address, not a secret — it can only write, never read
SENTRY_DSN = "https://3203c5a1d44bb6713e370774f09c021b@o4511851212242944.ingest.de.sentry.io/4511932516401232"
# --- the money path (phase 4). ---
# Opened 18 Aug 2026 by the owner's call, Sepolia waived: the blast radius is
# 227 BYKO per attempt behind the treasury's five locks. ADVANCES_OPEN = "0"
# is the kill switch — one line, one deploy.
ADVANCES_OPEN = "1"
CHAIN_ID = "8453"
TOKEN_ADDRESS = "0x078bb16e24C8931Fc007928c370422e5e38F4372"   # BYKO (EIP-55)
OPS_ADDRESS = "0x42873C60bC22424dBB4518DF7bE8b7F9eF4ac1D6"     # BYKO Ops (sender)
ADVANCE_AMOUNT = "227"          # whole BYKO per claim
MAX_CLAIMS_LIFETIME = "5"       # per wallet, forever
MAX_ADVANCES_PER_DAY = "200"    # global cap: the most given away while asleep;
                                # the stock floor closes the faucet first anyway
MIN_OPS_BALANCE = "2270"        # faucet floor: 10 advances kept as dispute margin

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API paths reach the worker first; everything else is served as an asset.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "byko-app227"
database_id = "a2ae7626-abdc-4a2b-a6b6-de94f88e9b26"

[[kv_namespaces]]
binding = "KV"
id = "1f7870d93427476f91cd5bc6b8e98db2"

# One Durable Object instance per fid — the serialisation point for anything
# that must never run twice for the same user. SQLite-backed classes, which
# work on every plan.
[[durable_objects.bindings]]
name = "FID_LOCK"
class_name = "FidLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FidLock"]

[[queues.producers]]
binding = "JOBS"
queue = "byko-app227-jobs"

[[queues.consumers]]
queue = "byko-app227-jobs"
max_batch_size = 10
max_retries = 3

[triggers]
# placeholder cadence — the real schedule arrives with the logic that needs it
crons = ["*/15 * * * *"]

[observability]
enabled = true
